name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evaluation-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install adapter contract dependency
        # Match the pinned WorkflowEvals lock; no model or API key is needed.
        run: python -m pip install typesafe-sdk==0.7.2
      - name: Test evaluation accounting and resume contracts
        run: python -m unittest discover -s scripts -p 'test_*.py'
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.91.0", stable]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +${{ matrix.rust }} fmt --check
      - name: Lint
        run: cargo +${{ matrix.rust }} clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +${{ matrix.rust }} test --locked --lib --bins --tests --examples --all-features
      - name: Check documentation
        run: cargo +${{ matrix.rust }} test --locked --doc
      - name: Test video decoding
        if: matrix.rust == 'stable'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          cargo +${{ matrix.rust }} test --locked --lib media::tests -- --ignored
      - name: Verify package
        if: matrix.rust == 'stable'
        run: cargo +${{ matrix.rust }} package --locked
